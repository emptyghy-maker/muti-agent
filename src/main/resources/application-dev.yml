spring:
  datasource:
    app:
      jdbc-url: ${APP_DB_URL}
      username: ${APP_DB_USERNAME}
      password: ${APP_DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

llm:
  provider: qwen
  base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  api-key: ${QWEN_API_KEY}
  # 强制 JSON 输出（DashScope 兼容模式支持 json_object）；如接口报不支持，置空回滚
  response-format: ${QWEN_RESPONSE_FORMAT:json_object}
  # 生产默认 FAILOVER：仅额度/限流/服务不可用时切换；评测必须设 FIXED，保证一个样本只跑指定模型。
  routing:
    mode: ${LLM_ROUTING_MODE:FAILOVER}
    cooldown-ms: ${LLM_ROUTING_COOLDOWN_MS:1800000}
    # 超时可能已产生费用且继续换模型会拉长尾延迟，默认不因超时切换。
    failover-on-timeout: ${LLM_FAILOVER_ON_TIMEOUT:false}
  models:
    # 快任务优先消耗较早到期的独立免费桶；别名 qwen3.7-flash 的免费桶已耗尽，不再使用。
    default: ${QWEN_MODEL_DEFAULT:qwen3.7-flash-2026-07-15}
    default-fallbacks: ${QWEN_MODEL_DEFAULT_FALLBACKS:qwen3.8-flash}
    # 行程规划以 27B 平衡质量和速度；Max 仅在额度/限流故障时接管，不因质量差自动换模型。
    sql: ${QWEN_MODEL_SQL:qwen3.8-27b}
    sql-fallbacks: ${QWEN_MODEL_SQL_FALLBACKS:qwen3.8-max-0902,qwen3.8-flash}
    # Qwen3.8 默认 xhigh 思考；规划 Agent 只负责分天/排序/餐次，普通调用显式关闭隐藏推理。
    sql-reasoning-effort: ${QWEN_PLAN_REASONING_EFFORT:none}
    sql-max-tokens: ${QWEN_PLAN_MAX_TOKENS:1024}
    # 修复使用快模型，避免一次修复等待 300 秒；强修复仍复用 sql 模型池。
    repair: ${QWEN_MODEL_REPAIR:qwen3.8-flash}
    repair-fallbacks: ${QWEN_MODEL_REPAIR_FALLBACKS:qwen3.7-flash-2026-07-15,qwen3.8-27b}
  # 阶段2 联网检索（enable_search）：客户端显式关闭思考并按同一故障类型切换模型。
  search-model: ${QWEN_SEARCH_MODEL:qwen3.7-flash-2026-07-15}
  search-fallbacks: ${QWEN_SEARCH_FALLBACKS:qwen3.8-flash}
  search-timeout-ms: ${QWEN_SEARCH_TIMEOUT_MS:90000}
  # 模型计费单价（元/百万 token，输入/输出），用于用量审计台的费用估算
  pricing:
    # 华北2（北京）公开价；免费额度内仍记录等价成本，便于不同模型横向比较。
    qwen3.7-flash: { in: 0.2, out: 0.8 }
    qwen3.7-flash-2026-07-15: { in: 0.2, out: 0.8 }
    qwen3.8-flash: { in: 0.8, out: 2.7 }
    qwen3.8-27b: { in: 3, out: 12 }
    qwen3.8-max: { in: 12, out: 36 }
    qwen3.8-max-0902: { in: 12, out: 36 }
    deepseek-v4-flash-0731: { in: 1.5, out: 4.5 }
    glm-5.2: { in: 8, out: 28 }
    kimi-k3: { in: 20, out: 100 }

# 美食候选数量（1 天 3 餐 = 1 早餐 + 2 正餐）：目标 = max(min-total, (早餐+正餐)×天数)，上限为候选池大小
candidate:
  food:
    breakfast-per-day: 3
    main-meal-per-day: 6
    min-total: 15

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

# 日志级别：控制台输出（Spring Boot 默认即输出到 Console，这里显式声明便于按需调到 DEBUG）
logging:
  level:
    com.ghy.mutiagent: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO

# MyBatis-Plus SQL 日志：把每一条执行的 SQL 打到控制台（监控「运行内容」用，嫌吵可删掉）
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# S06-B：会话权威存储（db=MySQL 快照权威、Redis 仅缓存；redis=保持 S06-A 语义）与操作租约；
# read-only 为回退演练开关（维护窗口关闭写入口，读取与归属校验保持）；
# parallel-candidates 为候选通道并行预热开关（回退：设 TRAVEL_PARALLEL_CANDIDATES=false 恢复旧串行懒加载）
travel:
  session:
    authority: ${TRAVEL_SESSION_AUTHORITY:db}
    # 断点恢复窗口：未结束会话距最近活动超过该时长即视为过期（滑动续期；已结束会话不受此影响）
    resume-ttl-ms: ${TRAVEL_SESSION_RESUME_TTL_MS:1800000}
  operation:
    lease-ms: 60000
  read-only: ${TRAVEL_READ_ONLY:false}
  parallel-candidates: ${TRAVEL_PARALLEL_CANDIDATES:true}
# Observability 优化与运行记录中心（默认全关，安全发布；缺 obs_ 表不影响启动）
observability:
  enabled: ${OBS_ENABLED:false}
  capture:
    enabled: ${OBS_CAPTURE_ENABLED:false}
    mode: BUFFERED
  buffer:
    capacity: 10000
  batch:
    size: 200
    interval-ms: 1000
  payload:
    max-bytes: 262144
  retention:
    days: 30

# POI 推荐计数与自动晋升（网搜店 → 知识库）：
# 推荐=被纳入候选池展示、勾选=用户确认选择，均按不同会话数计；达到任一阈值且质量门槛通过 → KB_PROMOTED。
food-promotion:
  recommend-threshold: 3
  select-threshold: 2
  reuse-freshness-days: 90
